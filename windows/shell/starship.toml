# Starship prompt — Catppuccin Mocha
# 两行布局：上行 目录 / git / 语言环境，下行 提示符
# 只显示会变的信息，不显示每次都一样的东西（用户名、主机名）

"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$fill\
$python\
$conda\
$nodejs\
$java\
$rust\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 800
scan_timeout = 30

palette = 'mocha'

[palettes.mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

[fill]
symbol = " "
style = "surface0"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
read_only = " "
read_only_style = "red"
home_symbol = "~"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold mauve)"

[git_branch]
symbol = " "
style = "bold mauve"
format = "[$symbol$branch]($style)(:[$remote_branch](overlay1)) "
truncation_length = 24

[git_status]
style = "bold peach"
format = '([\[$all_status$ahead_behind\]]($style) )'
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[git_state]
style = "bold red"
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[python]
symbol = " "
style = "yellow"
format = '[${symbol}${pyenv_prefix}(${version})]($style) '
detect_extensions = ["py", "ipynb"]

[conda]
symbol = " "
style = "teal"
format = "[$symbol$environment]($style) "
ignore_base = true

[nodejs]
symbol = " "
style = "green"
format = "[$symbol($version)]($style) "

[java]
symbol = " "
style = "red"
format = "[$symbol($version)]($style) "

[rust]
symbol = " "
style = "peach"
format = "[$symbol($version)]($style) "

[cmd_duration]
min_time = 2000
style = "subtext0"
format = "[ $duration]($style) "
show_milliseconds = false

# 关掉不需要的模块，减少每次渲染开销
[hostname]
disabled = true

[username]
disabled = true

[package]
disabled = true

[docker_context]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[buf]
disabled = true

[nix_shell]
disabled = true
